<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: usa a tela inteira em celulares com notch (o JSX respeita env(safe-area-inset-*)) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1220">
  <title>Encontre Meu Carro - ADS-ESTACIA</title>
  <style>
    html, body, #root { height: 100%; margin: 0; background: #0a1220; }
    body { overflow: hidden; overscroll-behavior: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 1) React 18 (UMD, build de produção, versão fixada) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- 2) Three.js r128 + fallback automático de CDN.
          (Para funcionar offline/PWA, copie os arquivos para assets/vendor/ e aponte para eles como 3º fallback.) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>

  <!-- 3) OrbitControls: DEVE vir depois do three.js (ele se anexa a THREE.OrbitControls) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>(window.THREE && window.THREE.OrbitControls) || document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');</script>

  <!-- 3.4) Núcleo compartilhado (A*, pisos, rampa, cenário, carro) — script comum, antes dos .jsx -->
  <script src="js/estacia3d.js"></script>

  <!-- 3.5) Mapa extraído por visão computacional (scripts/extrair_mapa.py). Script comum: funciona até em file:// -->
  <script src="assets/mapa_estacia.js"></script>

  <!-- 4) Babel standalone + o app. O JSX ainda espera por THREE/OrbitControls (polling), então a ordem acima é só uma 1ª linha de defesa. -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="js/encontremeucarro.jsx"></script>

  <noscript>Esta tela precisa de JavaScript habilitado.</noscript>
</body>
</html>
